[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bincovering"
version = "0.1.0"
description = "Reproducible bin covering research experiments"
requires-python = ">=3.11,<3.12"
dependencies = ["hydra-core==1.3.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["ruff>=0.16,<0.17"]
browser = ["playwright>=1.63,<1.64"]
plot = ["matplotlib>=3.8,<4"]
web = ["Flask>=3,<4"]
build = ["cmake>=3.20,<5", "build>=1.6,<2"]

[project.scripts]
bincovering = "bincovering.cli:main"
bincovering-run = "bincovering.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bincovering = ["configs/*.yaml", "configs/*/*.yaml", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["server", "web_interface", "python_graphs", ".tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
